name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to rehearse release notes for (rehearsal only -- does not publish)'
        required: true

jobs:
  # Only meaningful for a real tag push -- a workflow_dispatch rehearsal has
  # no tag ref to check, so this step just no-ops for that event instead.
  verify-master-ancestry:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Verify tag is descended from master
        if: github.event_name == 'push'
        run: |
          git fetch origin master
          if ! git merge-base --is-ancestor origin/master "$GITHUB_SHA"; then
            echo "ERROR: Tag $GITHUB_REF_NAME is not descended from master. Only tag from master."
            exit 1
          fi
          echo "OK: $GITHUB_REF_NAME is descended from master"

  create-release:
    needs: verify-master-ancestry
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Resolve tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          fi

      # Rehearsal: prove the release-notes generation works without creating
      # a real release -- a pushed tag is public and hard to take back.
      - name: Rehearsal -- preview release notes only, publish nothing
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${{ github.repository }}/releases/generate-notes" \
            -f tag_name="${{ steps.tag.outputs.tag }}" \
            --jq .body >> "$GITHUB_STEP_SUMMARY"

      # roku-release.yml triggers on this same v* tag push and also creates
      # this release (attaching the Roku zip) -- the two jobs race with no
      # dependency between them. If roku-release.yml wins, `gh release
      # create` below would hard-fail ("release already exists"), so check
      # first and defer instead of racing it. The narrow window between the
      # check and the create (roku-release.yml finishes in between) is
      # covered by treating that specific create failure as a non-error too.
      - name: Publish release (defers to roku-release.yml if it got there first)
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists (created by roku-release.yml, which shares this tag namespace) -- nothing to do."
            exit 0
          fi
          if ! gh release create "$TAG" --title "$TAG" --generate-notes 2>err.log; then
            if grep -qi 'already exists' err.log; then
              echo "Release $TAG was created concurrently by roku-release.yml -- nothing more to do."
              cat err.log
              exit 0
            fi
            cat err.log >&2
            exit 1
          fi
