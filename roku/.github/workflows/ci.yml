name: CI

on:
  pull_request:
    branches: [main]

jobs:
  # ---------------------------------------------------------------------------
  # Lint — bslint (BrightScript static analysis).
  # ---------------------------------------------------------------------------
  lint:
    name: Lint (bslint)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run bslint
        run: npx --yes @rokucommunity/bslint

  # ---------------------------------------------------------------------------
  # Security scan — gitleaks, catching hardcoded credentials/secrets.
  # ---------------------------------------------------------------------------
  security:
    name: Security scan (gitleaks)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
        run: |
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          curl -sSfLO "${base}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfLO "${base}/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          sha256sum --check --ignore-missing "gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          tar -xzf "gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" gitleaks
          sudo mv gitleaks /usr/local/bin/

      - name: Scan PR commits
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: gitleaks git --redact --verbose --log-opts="--diff-merges=first-parent ${BASE_SHA}..${HEAD_SHA}" .

  # ---------------------------------------------------------------------------
  # Tests — no automated test framework for BrightScript in this project.
  # Rule 3's "run the test suite" step is manual sideload verification instead.
  # ---------------------------------------------------------------------------
  test:
    name: Tests
    runs-on: ubuntu-latest

    steps:
      - name: No automated tests configured
        run: echo "No BrightScript test framework in use — verify manually via sideload before merging."

  # ---------------------------------------------------------------------------
  # Build — package the Roku channel and upload it as a PR artifact so
  # reviewers can sideload-test the exact commit under review.
  # ---------------------------------------------------------------------------
  build:
    name: Build channel package
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Package channel zip
        run: |
          mkdir -p build
          zip -r "build/shop-schedule-roku-pr-${{ github.event.pull_request.number }}.zip" \
            manifest components source images media \
            -x '*.bak'

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: shop-schedule-roku-pr-${{ github.event.pull_request.number }}
          path: build/shop-schedule-roku-pr-${{ github.event.pull_request.number }}.zip
          retention-days: 14
